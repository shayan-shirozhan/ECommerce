name: CI

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
      - "fix/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore and audit NuGet dependencies
        run: |
          dotnet restore ECommerce.slnx \
            -p:NuGetAuditMode=all \
            -p:NuGetAuditLevel=moderate \
            '-p:WarningsAsErrors=NU1900%3BNU1902%3BNU1903%3BNU1904%3BNU1905'

      - name: Verify formatting of changed C# files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t changed_cs_files < <(
            git diff --name-only --diff-filter=ACMRT "${BASE_SHA}...HEAD" -- '*.cs'
          )

          if (( ${#changed_cs_files[@]} == 0 )); then
            echo "No changed C# files; formatting verification is not applicable."
            exit 0
          fi

          printf 'Verifying formatting for changed C# files:\n'
          printf ' - %s\n' "${changed_cs_files[@]}"

          dotnet format ECommerce.slnx \
            --verify-no-changes \
            --no-restore \
            --include "${changed_cs_files[@]}"

      - name: Build
        run: dotnet build ECommerce.slnx --configuration Release --no-restore

      - name: Test and collect code coverage
        run: >-
          dotnet test ECommerce.slnx
          --configuration Release
          --no-build
          --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults/ci
          --logger "trx;LogFileName=ecommerce-tests.trx"

      - name: Summarize code coverage
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report_paths = sorted(Path("TestResults/ci").rglob("coverage.cobertura.xml"))
          # Coverlet can expose the same report both as a result file and as a TRX attachment.
          # Deduplicate identical copies so covered/valid counts are not double-counted.
          reports_by_hash = {}
          for report in report_paths:
              digest = hashlib.sha256(report.read_bytes()).hexdigest()
              reports_by_hash.setdefault(digest, report)
          reports = list(reports_by_hash.values())
          if not reports:
              message = "No Cobertura coverage report was produced."
              print(f"::error::{message}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("## Code coverage\n\n")
                  summary.write(f"> {message}\n")
              sys.exit(1)

          totals = {
              "lines-covered": 0,
              "lines-valid": 0,
              "branches-covered": 0,
              "branches-valid": 0,
          }

          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, "0"))

          lines_valid = totals["lines-valid"]
          if lines_valid == 0:
              raise SystemExit("Cobertura reports contain no valid lines.")

          line_percent = totals["lines-covered"] / lines_valid * 100
          branches_valid = totals["branches-valid"]
          branch_percent = (
              f"{totals['branches-covered'] / branches_valid * 100:.2f}%"
              if branches_valid
              else "N/A"
          )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Code coverage\n\n")
              summary.write("| Metric | Result |\n|---|---:|\n")
              summary.write(f"| Line coverage | **{line_percent:.2f}%** ({totals['lines-covered']}/{lines_valid}) |\n")
              summary.write(f"| Branch coverage | {branch_percent} ({totals['branches-covered']}/{branches_valid}) |\n")
              summary.write(f"| Cobertura reports | {len(reports)} |\n")
          PY

      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-coverage-results
          path: TestResults/ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Build Docker image
        run: docker build --pull --tag ecommerce-api:ci --file Dockerfile .

      - name: Smoke test Docker image at runtime
        run: bash ./scripts/ci/docker-runtime-smoke-test.sh ecommerce-api:ci

      - name: Validate public Demo Docker Compose configuration
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ecommerce-demo.env" <<'EOF'
          DEMO_POSTGRES_USER=ecommerce_demo
          DEMO_POSTGRES_PASSWORD=ci_demo_postgres_password_0123456789
          DEMO_JWT_SECRET_KEY=ci_demo_jwt_secret_key_with_more_than_32_bytes
          DEMO_SEED_ADMIN_PASSWORD=CiAdmin_123!
          DEMO_SEED_SELLER_PASSWORD=CiSeller_234!
          DEMO_SEED_SECOND_SELLER_PASSWORD=CiSecond_345!
          DEMO_SEED_CUSTOMER_PASSWORD=CiCustomer_456!
          DEMO_ALLOWED_HOSTS=localhost;127.0.0.1
          DEMO_API_BIND_ADDRESS=127.0.0.1
          DEMO_API_PORT=18081
          DEMO_DOCKER_SUBNET=172.30.0.0/24
          DEMO_DOCKER_GATEWAY=172.30.0.1
          DEMO_API_DOCUMENTATION_ENABLED=false
          SMTP_EMAIL_HOST=smtp.example.com
          SMTP_EMAIL_PORT=587
          SMTP_EMAIL_SECURITY=StartTls
          SMTP_EMAIL_USERNAME=
          SMTP_EMAIL_PASSWORD=
          SMTP_EMAIL_FROM_ADDRESS=no-reply@example.com
          SMTP_EMAIL_FROM_NAME=ECommerce
          PASSWORD_RESET_EMAIL_FRONTEND_URL=https://demo.example.com/reset-password
          EOF
          docker compose \
            --env-file "$RUNNER_TEMP/ecommerce-demo.env" \
            --file docker-compose.demo.yml \
            config --quiet
