name: CI

on:
  push:
    branches:
      - main
      - master
      - "fix/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ECommerce.slnx

      - name: Build
        run: dotnet build ECommerce.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ECommerce.slnx --configuration Release --no-build
