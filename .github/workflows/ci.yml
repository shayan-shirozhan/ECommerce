name: CI

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
      - "fix/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore and audit NuGet dependencies
        run: |
          dotnet restore ECommerce.slnx \
            -p:NuGetAuditMode=all \
            -p:NuGetAuditLevel=moderate \
            '-p:WarningsAsErrors=NU1900%3BNU1902%3BNU1903%3BNU1904%3BNU1905'

      - name: Verify formatting of changed C# files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t changed_cs_files < <(
            git diff --name-only --diff-filter=ACMRT "${BASE_SHA}...HEAD" -- '*.cs'
          )

          if (( ${#changed_cs_files[@]} == 0 )); then
            echo "No changed C# files; formatting verification is not applicable."
            exit 0
          fi

          printf 'Verifying formatting for changed C# files:\n'
          printf ' - %s\n' "${changed_cs_files[@]}"

          dotnet format ECommerce.slnx \
            --verify-no-changes \
            --no-restore \
            --include "${changed_cs_files[@]}"

      - name: Build
        run: dotnet build ECommerce.slnx --configuration Release --no-restore

      - name: Test and collect code coverage
        run: >-
          dotnet test ECommerce.slnx
          --configuration Release
          --no-build
          --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults/ci
          --logger "trx;LogFileName=ecommerce-tests.trx"

      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-coverage-results
          path: TestResults/ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Build Docker image
        run: docker build --pull --tag ecommerce-api:ci --file Dockerfile .

      - name: Validate public Demo Docker Compose configuration
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ecommerce-demo.env" <<'EOF'
          DEMO_POSTGRES_USER=ecommerce_demo
          DEMO_POSTGRES_PASSWORD=ci_demo_postgres_password_0123456789
          DEMO_JWT_SECRET_KEY=ci_demo_jwt_secret_key_with_more_than_32_bytes
          DEMO_SEED_ADMIN_PASSWORD=CiAdmin_123!
          DEMO_SEED_SELLER_PASSWORD=CiSeller_234!
          DEMO_SEED_SECOND_SELLER_PASSWORD=CiSecond_345!
          DEMO_SEED_CUSTOMER_PASSWORD=CiCustomer_456!
          DEMO_ALLOWED_HOSTS=localhost;127.0.0.1
          DEMO_API_BIND_ADDRESS=127.0.0.1
          DEMO_API_PORT=18081
          DEMO_DOCKER_SUBNET=172.30.0.0/24
          DEMO_DOCKER_GATEWAY=172.30.0.1
          DEMO_API_DOCUMENTATION_ENABLED=false
          SMTP_EMAIL_HOST=smtp.example.com
          SMTP_EMAIL_PORT=587
          SMTP_EMAIL_SECURITY=StartTls
          SMTP_EMAIL_USERNAME=
          SMTP_EMAIL_PASSWORD=
          SMTP_EMAIL_FROM_ADDRESS=no-reply@example.com
          SMTP_EMAIL_FROM_NAME=ECommerce
          PASSWORD_RESET_EMAIL_FRONTEND_URL=https://demo.example.com/reset-password
          EOF
          docker compose \
            --env-file "$RUNNER_TEMP/ecommerce-demo.env" \
            --file docker-compose.demo.yml \
            config --quiet
